<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima do Tempo</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/scripts.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>Descubra o clima da sua cidade</h1>
        <p>Consulte as condições climáticas em tempo real.</p>
    </header>

    <section class="search-container">
        <div class="search-box">
            <input type="text" id="city" placeholder="Digite o nome da cidade..." autocomplete="off">
            <div id="suggestions" class="suggestions hide"></div>
        </div>
        <button id="search-btn">Pesquisar</button>
    </section>

    <section class="weather-summary">
        <div class="summary-left">
            <div class="summary-weather">
                <img id="weather-summary-icon" class="weather-summary-icon" src="" alt="Ícone do clima">
                <p id="summary-description" class="summary-description">Céu limpo</p>
            </div>
            <div class="summary-place">
                <h2 id="summary-city-name">Rio de Janeiro</h2>
            </div>
        </div>
        <div class="summary-right">
            <span>Temperatura</span>
            <strong id="summary-temperature" class="summary-temperature">28°C</strong>
            <span>
                Sensação térmica: <strong id="feels-like">26°C</strong>
            </span>
        </div>
    </section>

    <section class="weather-card">
        <div class="info">
            <span>Umidade</span>
            <strong id="humidity">72%</strong>
        </div>

        <div class="info">
            <span>Velocidade do vento</span>
            <strong id="wind">15 km/h</strong>
        </div>

        <div class="info">
            <span>Nascer do sol</span>
            <strong id="sunrise">06:18</strong>
        </div>

        <div class="info">
            <span>Pôr do sol</span>
            <strong id="sunset">17:34</strong>
        </div>
    </section>
</body>
</html>
